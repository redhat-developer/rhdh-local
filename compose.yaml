services:
  # Optional PostgreSQL: merge compose-with-db.yaml (see docs/rhdh-local-guide/postgresql-guide.md)
  # Example: podman compose -f compose.yaml -f compose-with-db.yaml up -d

  rhdh:
    container_name: rhdh
    image: ${RHDH_IMAGE:-quay.io/rhdh-community/rhdh:next}
    env_file:
      - path: "./default.env"
        required: true
      - path: "./.env"
        required: false
    user: "1001"
    entrypoint:
      - "/opt/app-root/src/wait-for-plugins-and-start.sh"
    ports: # dclint disable-line no-unbound-port-interfaces
      - "7007:7007"
      - "127.0.0.1:9229:9229"
    environment:
      NODE_OPTIONS: "--inspect=0.0.0.0:9229 --no-node-snapshot"
    volumes:
      # TechDocs source files are bind-mounted read-only and copied to a writable
      # in-container workdir on startup
      - ./mkdocs.yaml:/opt/app-root/src/techdocs-source/mkdocs.yaml:ro,z
      - ./docs:/opt/app-root/src/techdocs-source/docs:ro,z
      - ./catalog-info.yaml:/opt/app-root/src/techdocs-source/catalog-info.yaml:ro,z
      - ./wait-for-plugins-and-start.sh:/opt/app-root/src/wait-for-plugins-and-start.sh:Z
      - ./configs:/opt/app-root/src/configs:z
      - dynamic-plugins-root:/opt/app-root/src/dynamic-plugins-root
      - extensions-catalog:/extensions
    depends_on:
      install-dynamic-plugins:
        condition: service_completed_successfully

  install-dynamic-plugins:
    container_name: rhdh-plugins-installer
    image: ${RHDH_IMAGE:-quay.io/rhdh-community/rhdh:next}
    # docker compose volumes are owned by root, so we need to run as root to write to them
    # the main rhdh container will be able to read from this as files are world readable
    user: "root"
    entrypoint:
      - ./prepare-and-install-dynamic-plugins.sh
    env_file:
      - path: "./default.env"
        required: true
      - path: "./.env"
        required: false
    volumes:
      - ./prepare-and-install-dynamic-plugins.sh:/opt/app-root/src/prepare-and-install-dynamic-plugins.sh:Z
      - ./local-plugins:/opt/app-root/src/local-plugins:Z
      - ./configs:/opt/app-root/src/configs:z
      - dynamic-plugins-root:/opt/app-root/src/dynamic-plugins-root
      - extensions-catalog:${CATALOG_ENTITIES_EXTRACT_DIR:-/extensions}

  # Offline Knowledge Portal: serves product documentation to Lightspeed Core.
  # Authenticate with registry.redhat.io before starting the stack.
  okp:
    image: ${OKP_IMAGE:-registry.redhat.io/offline-knowledge-portal/rhokp-rhel9:1.2.10-1786628394} # dclint disable-line service-image-require-explicit-tag
    container_name: okp
    environment:
      SOLR_HOST_BIND: "0.0.0.0"
      MIMIR_HTTPD_SERVER_NAME: "localhost"
      COMPRESSED: "true"
      ENCRYPT: "false"
    ports: # dclint disable-line no-unbound-port-interfaces
      - "8081:8080"
      - "8983:8983"
    command:
      - |
        set -e
        if [ "$$(uname -m)" = "aarch64" ]; then
          export JAVA_TOOL_OPTIONS="-XX:UseSVE=0"
        fi
        /opt/solr/bin/solr start --user-managed --force -m 1g
        rm -f /etc/httpd/conf.d/ssl.conf
        exec httpd -D FOREGROUND
    entrypoint: ["/bin/bash", "-c"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/ && curl -fsS -o /dev/null http://127.0.0.1:8983/solr/admin/info/system"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # Lightspeed Core Service (Library Mode)
  # Runs Lightspeed Core with its unified embedded stack configuration
  # Default image: quay.io/lightspeed-core/lightspeed-stack:dev-20260824-cbd182b
  # To override: Set LIGHTSPEED_CORE_IMAGE in your .env file
  lightspeed-core:
    image: ${LIGHTSPEED_CORE_IMAGE:-quay.io/lightspeed-core/lightspeed-stack:dev-20260824-cbd182b} # dclint disable-line service-image-require-explicit-tag #todo: change tag to official release when available
    container_name: lightspeed-core
    network_mode: "service:rhdh"
    depends_on:
      okp:
        condition: service_healthy
      rhdh:
        condition: service_started
    volumes:
      - ${LIGHTSPEED_STACK_CONFIG:-./configs/extra-files/lightspeed-stack.yaml}:/app-root/lightspeed-stack.yaml:Z
      - ./configs/extra-files/rhdh-profile.py:/app-root/rhdh-profile.py:Z
      - ${VERTEX_AI_CREDENTIALS_PATH:-./configs/extra-files/templates/placeholder.json}:/app-root/credentials.json:Z
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app-root/credentials.json
      SERVICE_HOST: 0.0.0.0
      OTEL_SDK_DISABLED: "true"
      OKP_SERVICE_URL: ${OKP_SERVICE_URL:-http://host.docker.internal:8081}
    env_file:
      - path: "./default.env"
        required: true
      - path: "./.env"
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  dynamic-plugins-root:
  extensions-catalog:
