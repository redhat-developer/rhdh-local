# This is the default dynamic plugins config, and any user configuration should be added dynamic-plugins.override.yaml instead
includes:
  - dynamic-plugins.default.yaml
  # Writable path in the init container for extensions plugin configuration.
  - /opt/app-root/src/dynamic-plugins-root/dynamic-plugins.extensions.yaml

plugins:
  # Guest auth backend module — RHDH 2+ no longer bundles auth provider plugins statically (https://redhat.atlassian.net/browse/RHIDP-15348).
  # These will be available as dynamic plugins (https://redhat.atlassian.net/browse/RHIDP-16098)
  # TODO: update this if/when it is listed in the DPDY. Remove this if it comes enabled by default in the DPDY.
  - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-auth-backend-module-guest-provider:bs_1.52.0__0.2.20'
    enabled: true

  # Tech Radar frontend plugin
  - package: 'oci://quay.io/rhdh/backstage-community-plugin-tech-radar:{{inherit}}'
    enabled: true

  # Quay plugins
  - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay-backend:bs_1.52.0__1.17.0'
    enabled: true

  - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay:bs_1.52.0__1.37.1'
    enabled: true
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-quay:
            mountPoints:
              - mountPoint: entity.page.image-registry/cards
                importName: QuayPage
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    anyOf:
                      - isQuayAvailable

  # Scaffolder Github plugin - used by Dynamic Plugin Software Templates
  - package: 'oci://quay.io/rhdh/backstage-plugin-scaffolder-backend-module-github:{{inherit}}'
    enabled: true

  #########################################################
  # Enable dynamic plugins installation by using Extensions
  #########################################################

  # RHDH no longer embeds these plugin wrappers in dynamic-plugins/dist.
  # Disable the obsolete catalog entries so they are omitted from generated
  # configuration, then replace them with the OCI artifacts.
  # Remove once RHDHBUGS-3710 is resolved.
  - package: './dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-catalog-backend-module-extensions-dynamic'
    enabled: false

  - package: './dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-extensions'
    enabled: false

  - package: './dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-extensions-backend-dynamic'
    enabled: false

  - package: 'oci://quay.io/rhdh/red-hat-developer-hub-backstage-plugin-catalog-backend-module-extensions:2.0.0--0.19.1!red-hat-developer-hub-backstage-plugin-catalog-backend-module-extensions'
    enabled: true
    pluginConfig:
      extensions:
        directory: ${RHDH_EXTENSIONS_DIRECTORY}

  - package: 'oci://quay.io/rhdh/red-hat-developer-hub-backstage-plugin-extensions:2.0.0--0.19.1!red-hat-developer-hub-backstage-plugin-extensions'
    enabled: true

  - package: 'oci://quay.io/rhdh/red-hat-developer-hub-backstage-plugin-extensions-backend:2.0.0--0.19.1!red-hat-developer-hub-backstage-plugin-extensions-backend'
    enabled: true
    pluginConfig:
      extensions:
        installation:
          enabled: true
          saveToSingleFile:
            # NOTE: the path needs to be writable by the main RHDH container user
            file: /opt/app-root/src/dynamic-plugins-root/dynamic-plugins.extensions.yaml
  ########## End Extensions #################################

  #########################################################
  # Developer Hub Intelligent Assistant plugins
  #########################################################

  # Developer Hub Intelligent Assistant frontend plugin
  - package: 'oci://quay.io/rhdh/red-hat-developer-hub-backstage-plugin-intelligent-assistant:{{inherit}}'
    enabled: true

  # Developer Hub Intelligent Assistant backend plugin
  - package: 'oci://quay.io/rhdh/red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend:{{inherit}}'
    enabled: true
